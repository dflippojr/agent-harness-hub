sonar.organization=dflippojr
sonar.projectKey=dflippojr_agent-harness-hub
sonar.projectName=agent-harness-hub
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=harness_hub
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/.pytest_cache/**,**/.ruff_cache/**,**/.venv/**
sonar.test.exclusions=**/.venv/**
sonar.python.coverage.reportPaths=coverage.xml
# Python coverage comes from pytest-cov. The browser modules, styles and markup under
# harness_hub/static have no coverage report, so keep them out of the coverage metric
# (they would otherwise count as 0% covered). They are still analyzed for issues.
sonar.coverage.exclusions=harness_hub/static/**
