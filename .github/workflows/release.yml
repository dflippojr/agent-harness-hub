name: Release

# A vX.Y.Z tag publishes that version (all jobs on GitHub-hosted runners):
#   build         - check the tag matches harness_hub.__version__, build the wheel, sdist and image once,
#                   smoke-test them and hand them on as artifacts; read-only
#   pypi          - publish the wheel and sdist through the PyPI trusted publisher (the only job with id-token: write)
#   ghcr          - push the built image as ghcr.io/dflippojr/agent-harness-hub:X.Y.Z and :latest with GITHUB_TOKEN
#                   (the only job with packages: write); it runs after PyPI accepts the release
# Owner setup before the first tag: the PyPI project `agent-harness-hub` with a trusted publisher for this repository,
# workflow release.yml and environment `pypi`, and the `pypi` environment in this repository's settings.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dflippojr/agent-harness-hub

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: The tag matches harness_hub.__version__
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import harness_hub; print(harness_hub.__version__)")
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match harness_hub.__version__ $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m build --no-isolation
          ls -l dist
      - name: The wheel installs and carries the UI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install --require-hashes -r requirements.lock
          /tmp/wheel/bin/pip install --no-deps dist/agent_harness_hub-"$VERSION"-py3-none-any.whl
          cd /tmp
          test "$(/tmp/wheel/bin/python -m harness_hub --version)" = "harness_hub $VERSION"
          /tmp/wheel/bin/python -c "from importlib import resources; s = resources.files('harness_hub') / 'static'; assert (s / 'index.html').is_file() and (s / 'pages' / 'overview.mjs').is_file()"
      - name: Build and smoke-test the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          docker build --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$REVISION" -t "$IMAGE:$VERSION" .
          scripts/smoke-image.sh "$IMAGE:$VERSION" "$VERSION"
          docker save "$IMAGE:$VERSION" | gzip > image.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image
          path: image.tar.gz
          if-no-files-found: error
          retention-days: 7

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agent-harness-hub/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  ghcr:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: image
      - name: Push the version and latest tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          gunzip -c image.tar.gz | docker load
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker logout ghcr.io
