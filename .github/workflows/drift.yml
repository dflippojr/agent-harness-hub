name: Daemon drift

# Nightly, on GitHub-hosted runners: the daemon contract suite (tests/contract), the e2e tests and the real-daemon UI
# journeys against agent-harness main HEAD instead of the commit ci.yml pins. scripts/drift_report.py then opens or
# refreshes one issue with the default GITHUB_TOKEN: "Bump agent-harness pin to <sha>" when everything passes, or one
# `bug` naming the failing cases and the agent-harness commits since the last green. It also comments when the pin is
# older than the 14 days AGENTS.md allows, and then fails the run (scripts/drift_report.py pin-age). A pull request
# that changes this workflow or the script runs it as a dry run: the report prints what it would write and writes
# nothing, and the pin's age is only a warning.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/drift.yml
      - scripts/drift_report.py

permissions:
  contents: read

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.main.outputs.sha }}
      pinned: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: agent-harness main HEAD
        id: main
        run: |
          sha=$(git ls-remote https://github.com/dflippojr/agent-harness refs/heads/main | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve agent-harness main" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: The pinned commit
        id: pin
        run: python3 scripts/drift_report.py pinned >> "$GITHUB_OUTPUT"

  daemon:
    # The contract suite and the e2e tests, on both operating systems the Hub runs on (as ci.yml's e2e job).
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the daemon at main HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dflippojr/agent-harness
          ref: ${{ needs.resolve.outputs.sha }}
          path: daemon
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install the daemon and the Hub
        id: install
        run: |
          python -m pip install --require-hashes -r requirements-e2e.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Contract suite against the daemon
        env:
          HUB_E2E_DAEMON_SRC: daemon
        run: python -m pytest tests/contract -m e2e -v -p no:cacheprovider --junitxml=drift-results/contract-${{ matrix.os }}.xml
      - name: E2E against the daemon
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          HUB_E2E_DAEMON_SRC: daemon
        run: python -m pytest tests/e2e -m e2e -v -p no:cacheprovider --junitxml=drift-results/e2e-${{ matrix.os }}.xml
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: drift-results-daemon-${{ matrix.os }}
          path: drift-results/
          if-no-files-found: ignore
          retention-days: 14

  ui:
    # The real-daemon UI journeys (docs/ui-testing.md), as ci.yml's ui job runs them.
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUB_UI_DAEMON_SRC: ${{ github.workspace }}/daemon
    steps:
      - name: Choose the disposable instance directory
        run: echo "HUB_UI_INSTANCE_DIR=$RUNNER_TEMP/hub-ui-tests" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the daemon at main HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dflippojr/agent-harness
          ref: ${{ needs.resolve.outputs.sha }}
          path: daemon
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/ui-tests/package-lock.json
      - name: Install the daemon, the Hub and Playwright
        run: |
          python -m pip install --require-hashes -r requirements-e2e.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
          npm --prefix tools/ui-tests ci
          npm --prefix tools/ui-tests exec -- playwright install --with-deps chromium webkit
      - name: UI journeys against the daemon
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: ${{ github.workspace }}/drift-results/ui.xml
        run: npm --prefix tools/ui-tests test -- --workers=1 --reporter=list,junit,html
      - name: Stop any instance left behind
        if: always()
        run: |
          for dir in "$HUB_UI_INSTANCE_DIR"/run-*; do
            if [ -d "$dir" ]; then python scripts/ui_instance.py stop --dir "$dir"; fi
          done
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: drift-results-ui
          path: drift-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the report, traces and instance logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: drift-ui-evidence
          path: |
            tools/ui-tests/playwright-report/
            tools/ui-tests/test-results/
            ${{ runner.temp }}/hub-ui-tests/logs/
          if-no-files-found: ignore
          retention-days: 7

  report:
    needs: [resolve, daemon, ui]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the results
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: drift-results-*
          path: drift-results
          merge-multiple: true
      - name: Open or refresh the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          DAEMON_SHA: ${{ needs.resolve.outputs.sha }}
          DAEMON_RESULT: ${{ needs.daemon.result }}
          UI_RESULT: ${{ needs.ui.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
        run: |
          mkdir -p drift-results
          python3 scripts/drift_report.py report --daemon-sha "$DAEMON_SHA" --results drift-results \
            --outcome "daemon=$DAEMON_RESULT" --outcome "ui=$UI_RESULT" --run-url "$RUN_URL" $DRY_RUN
      - name: The agent-harness pin is at most 14 days behind main
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          DAEMON_SHA: ${{ needs.resolve.outputs.sha }}
          MODE: ${{ github.event_name == 'pull_request' && 'warn' || 'fail' }}
        run: python3 scripts/drift_report.py pin-age --mode "$MODE" --daemon-sha "$DAEMON_SHA"
