name: CI

# All jobs run on GitHub-hosted runners (public repository: never self-hosted).
#   lint     - ruff, and a syntax check of every browser ES module
#   test     - the unit suite on Linux and Windows (the Hub runs on the daemon host, which can be either), with the
#              daemon contract suite against the fakes (tests/contract, [fake])
#   e2e      - a real Agent Harness daemon from a pinned dflippojr/agent-harness commit: the contract suite against it
#              ([daemon]), then claimed and read by the Hub. drift.yml runs both nightly at agent-harness main
#   ui       - browser journeys (tools/ui-tests) against a disposable fake model daemon and Hub (docs/ui-testing.md)
#   package  - the wheel (with the static UI), and the Docker image build and smoke test (scripts/smoke-image.sh)
#   sonar    - SonarCloud analysis of the test job's coverage; the quality gate fails this check
#   gate-guard - the shared gate guard (dflippojr/.github), pinned by full SHA: fails a pull request that deletes or
#              skips tests, adds retries, or edits workflows, coverage or Sonar config, unless the owner applied
#              gate-change-approved
#   gate     - the one check to require: always runs, fails unless lint, test, e2e, ui, package and gate-guard all succeeded
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # gate-guard reads the pull request's labels and the owner's label events. The called workflow can't hold more than
  # its caller, so both scopes are granted here.
  issues: read
  pull-requests: read

# A newer push to a PR cancels its older run. Every push to main gets its own group (its commit) and is never
# cancelled, so each commit of a batch merge is tested on its own: one group per ref would still drop the queued
# runs in between.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Ruff
        run: ruff check .
      - name: Browser modules parse and session behavior
        run: |
          for f in $(find harness_hub/static -name '*.mjs'); do node --check "$f"; done
          node --test tests/browser-session.test.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Unit tests
        # The floor is about a point under the measured line coverage (93% on Linux, 96% on Windows).
        run: python -m pytest -q --cov=harness_hub --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=92
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage.xml
          retention-days: 3

  sonar:
    # SonarCloud analysis of the `test` job's coverage. Automatic analysis is
    # turned off in SonarCloud; this job is the analysis. It runs on the same
    # Ubuntu image that uploads coverage.xml, so the absolute <source> paths in
    # it resolve. -Dsonar.qualitygate.wait=true fails this check when the gate fails.
    needs: test
    runs-on: ubuntu-latest
    # Forks have no secrets. Same-repository Dependabot PRs use the separate
    # Dependabot secret store; they run the same scan when its token is set.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check SonarCloud token availability
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$DEPENDABOT_PR" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarCloud analysis was not performed: add repository Dependabot secret SONAR_TOKEN, then rerun this PR workflow."
            echo "SonarCloud analysis was not performed because the repository Dependabot secret SONAR_TOKEN is unavailable. Add that secret and rerun this PR workflow to publish analysis." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SONAR_TOKEN is required for SonarCloud analysis." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.sonar-token.outputs.available == 'true'
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage
        if: steps.sonar-token.outputs.available == 'true'
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: coverage
      - name: Scan with SonarCloud
        if: steps.sonar-token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the daemon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dflippojr/agent-harness
          ref: aa5a9047dbe4bcba6b7ec3348d0cd529c00ebe2b
          path: daemon
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install the daemon and the Hub
        run: |
          python -m pip install --require-hashes -r requirements-e2e.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Contract suite against the pinned daemon
        env:
          HUB_E2E_DAEMON_SRC: daemon
        run: python -m pytest tests/contract -m e2e -v -p no:cacheprovider
      - name: Claim a real daemon and read the Overview
        env:
          HUB_E2E_DAEMON_SRC: daemon
        run: python -m pytest tests/e2e -m e2e -v -p no:cacheprovider

  ui:
    # Browser journeys (docs/ui-testing.md) against a disposable fake model daemon and Hub on loopback, with
    # synthetic data: desktop and phone, light and dark.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUB_UI_DAEMON_SRC: ${{ github.workspace }}/daemon
    steps:
      - name: Choose the disposable instance directory
        run: echo "HUB_UI_INSTANCE_DIR=$RUNNER_TEMP/hub-ui-tests" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out the daemon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dflippojr/agent-harness
          ref: aa5a9047dbe4bcba6b7ec3348d0cd529c00ebe2b
          path: daemon
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/ui-tests/package-lock.json
      - name: Install the daemon, the Hub and Playwright
        run: |
          python -m pip install --require-hashes -r requirements-e2e.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e .
          npm --prefix tools/ui-tests ci
          npm --prefix tools/ui-tests exec -- playwright install --with-deps chromium webkit
      - name: UI journeys
        run: npm --prefix tools/ui-tests test -- --workers=1
      - name: Stop any instance left behind
        if: always()
        run: |
          for dir in "$HUB_UI_INSTANCE_DIR"/run-*; do
            if [ -d "$dir" ]; then python scripts/ui_instance.py stop --dir "$dir"; fi
          done
      - name: Upload the report, traces and instance logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ui-test-evidence
          path: |
            tools/ui-tests/playwright-report/
            tools/ui-tests/test-results/
            ${{ runner.temp }}/hub-ui-tests/logs/
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m build --no-isolation
      - name: The wheel installs and carries the UI
        run: |
          python -m venv /tmp/wheel
          /tmp/wheel/bin/pip install --require-hashes -r requirements.lock
          /tmp/wheel/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wheel/bin/python -m harness_hub --version
          /tmp/wheel/bin/python -c "from importlib import resources; s = resources.files('harness_hub') / 'static'; assert (s / 'index.html').is_file() and (s / 'pages' / 'overview.mjs').is_file()"
      - name: Build and smoke-test the Docker image
        run: |
          docker build -t agent-harness-hub:ci .
          scripts/smoke-image.sh agent-harness-hub:ci

  gate-guard:
    # The shared gate guard, called at a full commit SHA that dflippojr/.github main contains; guard-ref names the same
    # SHA, as its README asks, so the script that judges the pull request is the one that was reviewed. It checks pull
    # requests only (a push prints a notice). The owner's label counts only when the owner applied it. Labels are read
    # when the check runs: after the owner applies one, re-run this job (or the failed jobs) to pass the check.
    uses: dflippojr/.github/.github/workflows/gate-guard.yml@051a053bfe27988c4bf092216a466388e24a389d
    with:
      guard-ref: 051a053bfe27988c4bf092216a466388e24a389d
      require-owner-label-actor: true

  gate:
    # The single check a ruleset (or `ao ready`) requires, so it never lists job names. It runs even when a needed
    # job failed or was cancelled, and fails unless every needed job succeeded. sonar is not here: its quality gate
    # is its own check.
    if: always()
    needs: [lint, test, e2e, ui, package, gate-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Not successful: $failed"
            exit 1
          fi
